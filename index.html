  button.gbtn .dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--accent2);display:none;}

  #popover, #contextMenu{

  #popover.show, #contextMenu.show{display:flex;flex-direction:column;gap:4px;}
  .pbtn{
    background:var(--panel3);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-size:13px;display:flex;align-items:center;gap:7px;

  #overlayClick{position:fixed;inset:0;z-index:40;display:none;}
  #overlayClick.show{display:block;}

  #canvasWrap{flex:1;position:relative;overflow:hidden;touch-action:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  #statusbar{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel);border-top:1px solid var(--line);
    padding:4px 8px;font-size:10.5px;color:var(--dim);gap:8px;flex-shrink:0;
  }
  #statusbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  #lenInput{
    position:absolute;z-index:20;background:#101214;color:var(--accent2);
    border:1px solid var(--accent2);border-radius:6px;padding:4px 6px;
    font-size:13px;width:110px;display:none;text-align:center;
  }

  /* Dinamik Ölçü ve Ses Gösterge Kutusu */
  #directInputBox {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(16,18,20,0.95); border: 2px solid var(--accent2);
    border-radius: 8px; padding: 8px 16px; font-size: 15px; font-weight: 600;
    color: var(--accent2); display: none; z-index: 35; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }

  #voiceStatus {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255, 92, 92, 0.2); border: 1px solid var(--danger);
    border-radius: 20px; padding: 6px 12px; font-size: 12px; color: var(--danger);
    display: none; z-index: 35; align-items: center; gap: 6px; font-weight: 600;
  }

  #toast{

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

class Point {
  constructor(x, y) {
    this.x = Number(x);
    this.y = Number(y);
  }

  distanceTo(p) {
    return Math.hypot(this.x - p.x, this.y - p.y);
  }

  midpointTo(p) {
    return new Point((this.x + p.x) / 2, (this.y + p.y) / 2);
  }

  projectToSegment(p1, p2) {
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return new Point(p1.x, p1.y);

    let t = ((this.x - p1.x) * dx + (this.y - p1.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return new Point(p1.x + t * dx, p1.y + t * dy);
  }

  distanceToSegment(p1, p2) {
    const proj = this.projectToSegment(p1, p2);
    return this.distanceTo(proj);
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('canvasWrap');

let shapes = [];
let undoStack = []; 
let nextId = 1;
let scale = 3;
let offX = 0, offY = 0;
let tool = 'mdf';        
let inputMode = 'pen';     
let orthoOn = true;
let snapOn = true;
let voiceControlOn = false;
let multiSelect = false;

let snapSettings = {
  endpoint: true,
  midpoint: true,
  pointSnap: true,
  perpendicular: true,
  tracking: true,
  corner: true,
  grid: false
};

let drawing = null;
let liveWorld = null;
let rawMouseWorld = null;
let snapResult = null;
let hoverTrackPoint = null;
let trackedPoints = [];

let selectedShapes = new Set();
let contextMenuTarget = null;
let dragSnapshot = null;   
let dragMoved = false;

let clipboard = [];
let pasteOffset = 0;

let editingLabel = null;
let directTypedLength = "";

const pointers = new Map();
let pinchStartDist=null, pinchStartScale=null, pinchStartMid=null, pinchStartOff=null;
let panLast=null;
let isMiddleMousePan = false;

const MDF_THICKNESS = 18; // mm

const lenInput = document.getElementById('lenInput');
const directInputBox = document.getElementById('directInputBox');
const directInputLabel = document.getElementById('directInputLabel');
const directInputVal = document.getElementById('directInputVal');
const voiceStatus = document.getElementById('voiceStatus');
const btnVoiceToggle = document.getElementById('btnVoiceToggle');
const toast = document.getElementById('toast');
const stMode = document.getElementById('stMode');
const stCoord = document.getElementById('stCoord');
const stZoom = document.getElementById('stZoom');
const popover = document.getElementById('popover');
const contextMenu = document.getElementById('contextMenu');
const overlayClick = document.getElementById('overlayClick');

// ---------- CM / MM DÖNÜŞÜM VE FORMATLAMA FONKSİYONLARI ----------

// Ekran ve CSV Çıktısı İçin: mm sayısal değerini '150' veya '150,7' biçiminde string yapar
function fmtLen(mm){
  const cmPart = Math.floor(mm / 10);
  const mmPart = Math.round(mm % 10);
  if(mmPart === 0){
    return cmPart.toString();
  } else {
    return cmPart + ',' + mmPart;
  }
}

// Girdi Dönüştürme: '150' -> 1500 mm (150 cm), '150,7' veya '150.7' -> 1507 mm (150 cm 7 mm)
function parseCmInputToMm(strVal){
  if(!strVal) return 0;
  const cleanStr = strVal.toString().trim().replace(',', '.');
  const parts = cleanStr.split('.');
  
  const cmVal = parseInt(parts[0], 10) || 0;
  let mmVal = 0;
  
  if(parts.length > 1 && parts[1].length > 0){
    mmVal = parseInt(parts[1].charAt(0), 10) || 0; // Virgülden sonraki ilk basamak mm
  }
  
  return (cmVal * 10) + mmVal;
}

function parseTurkishVoiceInput(transcript) {
  if (!transcript) return "";
  let text = transcript.replace(/virgül|nokta/g, ',').replace(/\s+/g, '');
  const match = text.match(/\d+(,\d+)?/);
  return match ? match[0] : "";
}

// CSV Dışa Aktarma (Format: 167,3 veya 150)
function exportToCSV() {
  if (shapes.length === 0) {
    showToast('Dışa aktarılacak eleman yok');
    return;
  }

  let csvContent = "\uFEFF"; // UTF-8 BOM
  csvContent += "ID;Tip;Etiket;Uzunluk (cm);Genişlik (mm)\n";

  shapes.forEach((s, idx) => {
    if (s.type === 'mdf' || s.type === 'line') {
      const lenMm = s.points[0].distanceTo(s.points[1]);
      const lenFormatted = fmtLen(lenMm); // 150 veya 167,3 şeklinde
      const widthFormatted = s.type === 'mdf' ? MDF_THICKNESS : 0;
      const label = s.label || `Parça ${idx + 1}`;
      
      csvContent += `${s.id};${s.type.toUpperCase()};"${label}";${lenFormatted};${widthFormatted}\n`;
    }
  });

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cizgi_cad_kesim_listesi_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV dosyası indirildi');
}

function pushHistory(){
  undoStack.push(JSON.stringify(shapes));
  if(undoStack.length > 30) undoStack.shift();
}

function undo(){
  if(undoStack.length === 0){
    showToast('Geri alınacak işlem yok');
    return;
  }
  shapes = JSON.parse(undoStack.pop());
  shapes.forEach(s => {
    s.points = s.points.map(p => new Point(p.x, p.y));
    if(s.rawCursor) s.rawCursor = new Point(s.rawCursor.x, s.rawCursor.y);
  });
  selectedShapes.clear();
  drawing = null;
  clearTrackedPoints();
  autosave();
  render();
  showToast('İşlem geri alındı');
}

function uid(){ return nextId++; }
function worldToScreen(p){ return { x: p.x*scale+offX, y: p.y*scale+offY }; }
function screenToWorld(p){ return new Point((p.x-offX)/scale, (p.y-offY)/scale); }

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 2000);
}

function resizeCanvas(){
  const r = wrap.getBoundingClientRect();
  cv.width = r.width*devicePixelRatio;
  cv.height = r.height*devicePixelRatio;
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  render();
}
window.addEventListener('resize', resizeCanvas);

const STORAGE_KEY = 'cizgi_cad_v14_data';
function save(showMsg){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({shapes,scale,offX,offY,nextId}));
    if(showMsg) showToast('Kaydedildi');
  }catch(e){ if(showMsg) showToast('Kaydedilemedi'); }
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    shapes = d.shapes||[]; scale=d.scale||3; offX=d.offX||0; offY=d.offY||0;
    shapes.forEach(s => {
      s.points = s.points.map(p => new Point(p.x, p.y));
      if(s.rawCursor) s.rawCursor = new Point(s.rawCursor.x, s.rawCursor.y);
    });
    nextId = d.nextId || (shapes.reduce((m,s)=>Math.max(m,s.id||0),0)+1);
    return true;
  }catch(e){ return false; }
}
function autosave(){ save(false); }

function getMdfCorners(p0, p1, rawCursor){
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const len = p0.distanceTo(p1) || 1;
  let nx = -dy / len, ny = dx / len;
  const t = MDF_THICKNESS;

  if(rawCursor){
    const cross = (p1.x - p0.x)*(rawCursor.y - p0.y) - (p1.y - p0.y)*(rawCursor.x - p0.x);
    if(cross < 0){
      nx = -nx; ny = -ny;
    }
  }

  return [
    new Point(p0.x, p0.y),
    new Point(p1.x, p1.y),
    new Point(p1.x + nx * t, p1.y + ny * t),
    new Point(p0.x + nx * t, p0.y + ny * t)
  ];
}

function getSnapPoints(excludeId){
  const pts = [];
  for(const s of shapes){
    if(s.id === excludeId || s.type === 'dim') continue;

    if(snapSettings.endpoint || snapSettings.pointSnap){
      if(s.type === 'mdf'){
        const corners = getMdfCorners(s.points[0], s.points[1], s.rawCursor);
        corners.forEach(p => pts.push({ point: p, type: 'point', parentShape: s }));
      } else {
        s.points.forEach(p => pts.push({ point: p, type: 'point', parentShape: s }));
      }
    }

    if(snapSettings.midpoint){
      if(s.type === 'line'){
        pts.push({ point: s.points[0].midpointTo(s.points[1]), type: 'mid', parentShape: s });
      } else if(s.type === 'rect' || s.type === 'mdf'){
        const p = s.type === 'mdf' ? getMdfCorners(s.points[0], s.points[1], s.rawCursor) : s.points;
        for(let i=0; i<4; i++){
          const a = p[i], b = p[(i+1)%4];
          pts.push({ point: a.midpointTo(b), type: 'mid', parentShape: s });
        }
      }
    }
  }
  return pts;
}

function addTrackedPoint(p){
  for(const tp of trackedPoints){
    if(tp.distanceTo(p) < 0.01) return;
  }
  trackedPoints.push(new Point(p.x, p.y));
  if(trackedPoints.length > 2) trackedPoints.shift();
}
function clearTrackedPoints(){
  trackedPoints = [];
}
function feedTrackedPointsFromPoints(pts){
  for(const p of pts) addTrackedPoint(p);
}

function computeSnap(worldPt, excludeId){
  if(!snapOn) return { point: worldPt, marker: null, guides: [], trackBase: null, trackDir: null, trackDist: 0 };
  
  const snapPts = getSnapPoints(excludeId);
  const radius = 14 / scale;
  let best = null, minD = Infinity;

  for(const sp of snapPts){
    const d = worldPt.distanceTo(sp.point);
    if(d < radius && d < minD){
      minD = d;
      best = sp;
    }
  }

  if(best){
    hoverTrackPoint = best.point;
    if(snapSettings.tracking && best.type === 'point'){
      addTrackedPoint(best.point);
    }
    return { point: best.point, marker: best.type, guides: [], trackBase: null, trackDir: null, trackDist: 0 };
  }

  if(snapSettings.tracking && trackedPoints.length){
    const tol = 16 / scale;

    if(trackedPoints.length >= 2){
      for(let i=0;i<trackedPoints.length;i++){
        for(let j=0;j<trackedPoints.length;j++){
          if(i===j) continue;
          const a = trackedPoints[i], b = trackedPoints[j];
          const candidate = new Point(a.x, b.y);
          if(worldPt.distanceTo(candidate) < tol){
            return { point: candidate, marker: 'track2', guides: [a, b], trackBase: null, trackDir: null, trackDist: 0 };
          }
        }
      }
    }

    for(const tp of trackedPoints){
      const dx = worldPt.x - tp.x;
      const dy = worldPt.y - tp.y;
      
      if(Math.abs(dx) < tol){
        const dirY = dy >= 0 ? 1 : -1;
        const dir = { x: 0, y: dirY };
        const snappedPt = new Point(tp.x, worldPt.y);
        const dist = Math.abs(dy);
        return { point: snappedPt, marker: 'track', guides: [tp], trackBase: tp, trackDir: dir, trackDist: dist };
      }
      
      if(Math.abs(dy) < tol){
        const dirX = dx >= 0 ? 1 : -1;
        const dir = { x: dirX, y: 0 };
        const snappedPt = new Point(worldPt.x, tp.y);
        const dist = Math.abs(dx);
        return { point: snappedPt, marker: 'track', guides: [tp], trackBase: tp, trackDir: dir, trackDist: dist };
      }
    }
  }

  if(snapSettings.perpendicular && drawing && drawing.points.length > 0){
    for(const s of shapes){
      if(s.id === excludeId || s.type === 'dim') continue;
      const edges = s.type === 'mdf' ? getMdfCorners(s.points[0], s.points[1], s.rawCursor) : s.points;
      for(let i=0; i < (s.type==='line'?1:edges.length); i++){
        const p1 = edges[i], p2 = edges[(i+1)%edges.length];
        const proj = worldPt.projectToSegment(p1, p2);
        if(worldPt.distanceTo(proj) < radius){
          return { point: proj, marker: 'perp', guides: [p1, p2], trackBase: null, trackDir: null, trackDist: 0 };
        }
      }
    }
  }

  return { point: worldPt, marker: null, guides: [], trackBase: null, trackDir: null, trackDist: 0 };
}

function applyOrtho(start, pt){
  if(!orthoOn || !start) return pt;
  const dx = Math.abs(pt.x - start.x), dy = Math.abs(pt.y - start.y);
  return dx >= dy ? new Point(pt.x, start.y) : new Point(start.x, pt.y);
}

let recognition = null;
let voiceCommitTimer = null;

function initVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('Cihazınız ses tanıma özelliğini desteklemiyor.');
    return null;
  }

  const rec = new SpeechRecognition();
  rec.lang = 'tr-TR';
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript;
    }

    transcript = transcript.trim().toLowerCase();

    if(!drawing && directTypedLength.length === 0 && !snapResult) return;

    const parsedStr = parseTurkishVoiceInput(transcript);

    if (parsedStr) {
      directTypedLength = parsedStr;
      updateDirectInputUI();

      clearTimeout(voiceCommitTimer);
      voiceCommitTimer = setTimeout(() => {
        if (directTypedLength.length > 0) {
          commitDirectTypedLength();
        }
      }, 400);
    }
  };

  rec.onerror = (event) => {
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      voiceControlOn = false;
      btnVoiceToggle.classList.remove('on');
      voiceStatus.classList.remove('active');
      showToast('Mikrofon izni verilmedi.');
    }
  };
  rec.onend = () => {
    if (voiceControlOn) {
      try { rec.start(); } catch(e){}
    } else {
      voiceStatus.classList.remove('active');
    }
  };

  return rec;
}

function startVoiceRecognition() {
  if (!window.isSecureContext) {
    showToast('Mikrofon için HTTP/HTTPS sunucusu gereklidir.');
    voiceControlOn = false;
    btnVoiceToggle.classList.remove('on');
    return;
  }
  if (!recognition) recognition = initVoiceRecognition();
  if (recognition) {
    try {
      recognition.start();
      voiceStatus.classList.add('active');
      showToast('Sesli ölçü dinleniyor (Örn: 150 veya 167,3)');
    } catch(e) {}
  }
}

function stopVoiceRecognition() {
  if (recognition) {
    try { recognition.stop(); } catch(e){}
  }
  voiceStatus.classList.remove('active');
}

function updateDirectInputUI() {
  if (directTypedLength.length > 0) {
    directInputBox.style.display = 'block';
    directInputVal.textContent = directTypedLength + ' cm';
  } else {
    directInputBox.style.display = 'none';
  }
}

function commitDirectTypedLength() {
  const mmLength = parseCmInputToMm(directTypedLength);
  const displayVal = directTypedLength;
  directTypedLength = "";
  updateDirectInputUI();

  if (mmLength <= 0) return;

  if (drawing && drawing.points.length > 0) {
    const p0 = drawing.points[0];
    let dir = { x: 1, y: 0 };

    if (snapResult && snapResult.trackBase && snapResult.trackDir) {
      dir = snapResult.trackDir;
    } else if (rawMouseWorld) {
      let pt = applyOrtho(p0, rawMouseWorld);
      const dist = p0.distanceTo(pt);
      if (dist > 0.001) {
        dir = { x: (pt.x - p0.x) / dist, y: (pt.y - p0.y) / dist };
      }
    }

    const p1 = new Point(p0.x + dir.x * mmLength, p0.y + dir.y * mmLength);
    
    pushHistory();
    if (drawing.type === 'mdf') {
      shapes.push({
        id: uid(),
        type: 'mdf',
        points: [p0, p1],
        rawCursor: rawMouseWorld || p1,
        label: ''
      });
    } else if (drawing.type === 'line') {
      shapes.push({
        id: uid(),
        type: 'line',
        points: [p0, p1],
        label: ''
      });
    }
    
    feedTrackedPointsFromPoints([p0, p1]);
    drawing = null;
    autosave();
    render();
    showToast(`Çizildi: ${displayVal} cm`);
  }
}

// Klavyeden sayısal girdi dinleme
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key >= '0' && e.key <= '9') {
    directTypedLength += e.key;
    updateDirectInputUI();
  } else if (e.key === ',' || e.key === '.') {
    if (!directTypedLength.includes(',')) {
      directTypedLength += ',';
      updateDirectInputUI();
    }
  } else if (e.key === 'Backspace') {
    directTypedLength = directTypedLength.slice(0, -1);
    updateDirectInputUI();
  } else if (e.key === 'Enter') {
    commitDirectTypedLength();
  } else if (e.key === 'Escape') {
    directTypedLength = "";
    updateDirectInputUI();
    drawing = null;
    selectedShapes.clear();
    render();
  }
});

btnVoiceToggle.addEventListener('click', () => {
  voiceControlOn = !voiceControlOn;
  btnVoiceToggle.classList.toggle('on', voiceControlOn);
  if (voiceControlOn) {
    startVoiceRecognition();
  } else {
    stopVoiceRecognition();
  }
});

document.getElementById('grpFile').addEventListener('click', () => {
  exportToCSV();
});

function render() {
  ctx.clearRect(0, 0, cv.width / devicePixelRatio, cv.height / devicePixelRatio);

  // Çizim nesnelerini çiz
  shapes.forEach(s => {
    const isSel = selectedShapes.has(s.id);
    ctx.strokeStyle = isSel ? '#ffb454' : '#4fa8ff';
    ctx.fillStyle = isSel ? 'rgba(255, 180, 84, 0.2)' : 'rgba(79, 168, 255, 0.15)';
    ctx.lineWidth = isSel ? 2.5 : 1.5;

    if (s.type === 'mdf') {
      const pts = getMdfCorners(s.points[0], s.points[1], s.rawCursor).map(worldToScreen);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1; i<4; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Ölçü etiketi (Tam cm için '150', küsüratlı için '167,3')
      const len = s.points[0].distanceTo(s.points[1]);
      const mid = s.points[0].midpointTo(s.points[1]);
      const sm = worldToScreen(mid);
      ctx.fillStyle = '#e8e8e8';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText((s.label ? s.label + ' ' : '') + fmtLen(len) + ' cm', sm.x, sm.y - 6);
    } else if (s.type === 'line') {
      const p0 = worldToScreen(s.points[0]);
      const p1 = worldToScreen(s.points[1]);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();

      const len = s.points[0].distanceTo(s.points[1]);
      const mid = s.points[0].midpointTo(s.points[1]);
      const sm = worldToScreen(mid);
      ctx.fillStyle = '#e8e8e8';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(fmtLen(len) + ' cm', sm.x, sm.y - 6);
    }
  });

  // Anlık Çizim / Önizleme
  if (drawing && drawing.points.length > 0) {
    const p0 = drawing.points[0];
    const p1 = liveWorld || p0;
    
    ctx.strokeStyle = '#ffb454';
    ctx.lineWidth = 1.5;

    if (drawing.type === 'mdf') {
      const pts = getMdfCorners(p0, p1, rawMouseWorld).map(worldToScreen);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1; i<4; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.stroke();
    } else {
      const sp0 = worldToScreen(p0);
      const sp1 = worldToScreen(p1);
      ctx.beginPath();
      ctx.moveTo(sp0.x, sp0.y);
      ctx.lineTo(sp1.x, sp1.y);
      ctx.stroke();
    }

    const len = p0.distanceTo(p1);
    const sm = worldToScreen(p0.midpointTo(p1));
    ctx.fillStyle = '#ffb454';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(fmtLen(len) + ' cm', sm.x, sm.y - 8);
  }

  // Snap İşaretçisi
  if (snapResult && snapResult.marker) {
    const sp = worldToScreen(snapResult.point);
    ctx.strokeStyle = '#4fa8ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 6, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// Tuval Etkileşimleri
wrap.addEventListener('pointerdown', (e) => {
  if (e.button === 1) {
    isMiddleMousePan = true;
    panLast = { x: e.clientX, y: e.clientY };
    return;
  }

  const rect = wrap.getBoundingClientRect();
  const screenPt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  rawMouseWorld = screenToWorld(screenPt);
  
  if (tool === 'pan') {
    panLast = { x: e.clientX, y: e.clientY };
    return;
  }

  snapResult = computeSnap(rawMouseWorld);
  let pt = snapResult.point;

  if (drawing) {
    pt = applyOrtho(drawing.points[0], pt);
    pushHistory();
    if (drawing.type === 'mdf') {
      shapes.push({
        id: uid(),
        type: 'mdf',
        points: [drawing.points[0], pt],
        rawCursor: rawMouseWorld,
        label: ''
      });
    } else {
      shapes.push({
        id: uid(),
        type: 'line',
        points: [drawing.points[0], pt],
        label: ''
      });
    }
    feedTrackedPointsFromPoints([drawing.points[0], pt]);
    drawing = null;
    autosave();
    render();
  } else {
    drawing = { type: tool === 'select' ? 'mdf' : tool, points: [pt] };
  }
});

wrap.addEventListener('pointermove', (e) => {
  if (isMiddleMousePan || (tool === 'pan' && panLast)) {
    offX += e.clientX - panLast.x;
    offY += e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
    render();
    return;
  }

  const rect = wrap.getBoundingClientRect();
  const screenPt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  rawMouseWorld = screenToWorld(screenPt);

  stCoord.textContent = `X:${fmtLen(rawMouseWorld.x * 10)} Y:${fmtLen(rawMouseWorld.y * 10)} cm`;

  if (drawing) {
    snapResult = computeSnap(rawMouseWorld);
    liveWorld = applyOrtho(drawing.points[0], snapResult.point);
  } else {
    snapResult = computeSnap(rawMouseWorld);
  }

  render();
});

wrap.addEventListener('pointerup', (e) => {
  if (e.button === 1) isMiddleMousePan = false;
  if (tool === 'pan') panLast = null;
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = wrap.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  offX = mouseX - (mouseX - offX) * zoomFactor;
  offY = mouseY - (mouseY - offY) * zoomFactor;
  scale *= zoomFactor;

  stZoom.textContent = `Ölçek: ${Math.round(scale * 33.3)}%`;
  render();
}, { passive: false });

// Topbar Buton Kontrolleri
document.getElementById('grpDraw').addEventListener('click', () => { tool = 'mdf'; stMode.textContent = 'Mod: MDF'; });
document.getElementById('toolDim').addEventListener('click', () => { tool = 'line'; stMode.textContent = 'Mod: Çizgi'; });
document.getElementById('btnPanOnly').addEventListener('click', () => { tool = 'pan'; stMode.textContent = 'Mod: Gezin'; });
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnOrtho').addEventListener('click', (e) => {
  orthoOn = !orthoOn;
  e.currentTarget.classList.toggle('on', orthoOn);
});
document.getElementById('btnSnap').addEventListener('click', (e) => {
  snapOn = !snapOn;
  e.currentTarget.classList.toggle('on', snapOn);
});

// Başlangıç Ayarları
resizeCanvas();
load();
render();

})();
</script>
